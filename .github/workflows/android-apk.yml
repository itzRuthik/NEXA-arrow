name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'game.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./android/gradlew --no-daemon --stacktrace -p android assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-arrows-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The APK is the requested deliverable, so keep the latest debug build at
      # the repository root on this task's working branch as well as as an artifact.
      - name: Publish APK on the working branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/80b5680b-nexa-arrow'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEXA-Arrows.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f NEXA-Arrows.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish NEXA ARROWS Android APK [skip ci]'
            git push origin HEAD:arena/80b5680b-nexa-arrow
          fi
