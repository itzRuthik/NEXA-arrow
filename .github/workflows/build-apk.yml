name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug + release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/NEXA-Arrows-${GITHUB_REF_NAME//\//-}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NEXA-Arrows-${GITHUB_REF_NAME//\//-}-release.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Arrows-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NEXA Arrows $GITHUB_REF_NAME" \
            --notes "NEXA Arrows Android APK — download and install on your device." \
            || true
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
